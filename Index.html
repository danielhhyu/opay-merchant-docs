<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPay Receipt</title>
    <style>
        /* Base Reset and App Layout */
        body {
            background-color: #000; /* Dark background to make the "phone" pop */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .phone-screen {
            background-color: #ffffff;
            width: 100%;
            max-width: 375px; /* Standard mobile width */
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Fake Mobile Status Bar */
        .status-bar {
            height: 24px;
            padding: 6px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            color: #333;
        }

        .status-icons span {
            margin-left: 4px;
        }

        /* OPay Receipt Styling */
        .receipt-content {
            padding: 20px;
            text-align: center;
        }

        .logo-area {
            color: #00d18d; /* OPay Green */
            font-weight: 900;
            font-size: 24px;
            margin: 20px 0;
        }

        .amount {
            font-size: 36px;
            font-weight: 700;
            margin: 5px 0;
            color: #000;
        }

        .status-pill {
            display: inline-block;
            color: #ff9800; /* OPay Pending Orange */
            background-color: #fff3e0;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }

        .details-list {
            text-align: left;
            margin-top: 40px;
            border-top: 1px dashed #eee;
            padding-top: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .label { color: #888; }
        .value { color: #222; font-weight: 500; text-align: right; width: 60%; }

        .footer-note {
            margin-top: 50px;
            color: #bbb;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="phone-screen">
    <div class="status-bar">
        <div id="phone-time">10:15</div>
        <div class="status-icons">
            <span>📶</span><span>🛜</span><span>🔋 84%</span>
        </div>
    </div>

    <div class="receipt-content">
        <div class="logo-area">OPay</div>
        <div class="amount">₦104,000,000.00</div>
        <div class="status-pill">PENDING</div>
        <div id="receipt-date" style="color: #999; font-size: 12px; margin-top: 10px;"></div>

        <div class="details-list">
            <div class="detail-row">
                <span class="label">Recipient</span>
                <span class="value">LIONSHARE MOTORS AND ACCESSORIES</span>
            </div>
            <div class="detail-row">
                <span class="label">Bank/Account</span>
                <span class="value">OPay | 6116534291</span>
            </div>
            <div class="detail-row">
                <span class="label">Transaction ID</span>
                <span class="value" id="tid"></span>
            </div>
            <div class="detail-row">
                <span class="label">Remark</span>
                <span class="value">Cocoa Beans Trade - 20 Tons</span>
            </div>
        </div>
        
        <div class="footer-note">
            Generated by OPay Digital Services
        </div>
    </div>
</div>

<script>
    // Live Clock for Status Bar
    function updateClock() {
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        document.getElementById('phone-time').innerText = timeStr;
        
        const dateOptions = { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' };
        document.getElementById('receipt-date').innerText = now.toLocaleString('en-US', dateOptions);
    }

    // Dynamic ID
    const randomID = "24" + Math.floor(Math.random() * 1e16);
    document.getElementById('tid').innerText = randomID;

    updateClock();
</script>

</body>
</html>
